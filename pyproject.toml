# Observatorio Inteligente da Educacao Superior — TCC-II
#
# Este arquivo configura APENAS ferramentas de desenvolvimento (lint, testes, tipos).
# Nenhuma dependencia de produto (FastAPI, DuckDB, SQLGlot, psycopg...) e declarada aqui
# ainda: elas entram quando a feature correspondente for implementada.
#
#   uv sync --group dev     instala as ferramentas no .venv do projeto
#   uv tool install ruff    alternativa que deixa o ruff no PATH global

[project]
name = "tcc-ii-observatorio"
version = "0.0.0"
description = "Plataforma de exploracao dos dados do Censo da Educacao Superior brasileira"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "psycopg[binary]>=3.3.5",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8.3",
    "mypy>=1.13",
]

[tool.uv]
# Ainda nao ha pacote instalavel: o repositorio e um projeto de aplicacao.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Os hooks em .claude/hooks NAO sao excluidos: sao o unico codigo Python que existe
# hoje e o post_edit_check roda ruff sobre eles a cada edicao.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import sort, UP pyupgrade, B bugbear, SIM simplificacao.
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 fora: tabelas de regex e mensagens de erro passam de 100 colunas por legibilidade,
# e o post_edit_check bloqueia a edicao a qualquer apontamento do ruff — seria falso positivo.
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["^\\.claude/", "^docs/"]
