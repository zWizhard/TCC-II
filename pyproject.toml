# Observatorio Inteligente da Educacao Superior — TCC-II
#
# Dependencias de produto entram quando a feature correspondente e implementada:
# duckdb/psycopg (ETL, Fase 3), fastapi/uvicorn/pydantic-settings (API, Fase 5).
#
#   uv sync --group dev     instala produto + ferramentas no .venv do projeto
#   uv tool install ruff    alternativa que deixa o ruff no PATH global

[project]
name = "tcc-ii-observatorio"
version = "0.0.0"
description = "Plataforma de exploracao dos dados do Censo da Educacao Superior brasileira"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.5",
    "fastapi>=0.115",
    "psycopg[binary]>=3.3.5",
    "pydantic-settings>=2.6",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.14",
    "pytest>=8.3",
    "mypy>=1.13",
    "httpx>=0.28",
]

[tool.uv]
# Ainda nao ha pacote instalavel: o repositorio e um projeto de aplicacao.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# Os hooks em .claude/hooks NAO sao excluidos: sao o unico codigo Python que existe
# hoje e o post_edit_check roda ruff sobre eles a cada edicao.
extend-exclude = ["docs"]

[tool.ruff.lint]
# E/F pycodestyle+pyflakes, I import sort, UP pyupgrade, B bugbear, SIM simplificacao.
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 fora: tabelas de regex e mensagens de erro passam de 100 colunas por legibilidade,
# e o post_edit_check bloqueia a edicao a qualquer apontamento do ruff — seria falso positivo.
ignore = ["E501"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
# A API e um pacote de aplicacao (package = false): a raiz entra no sys.path dos testes.
pythonpath = ["."]
# Starlette 1.x avisa sobre o httpx no TestClient; o substituto sugerido nao esta no indice.
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient` is deprecated"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
exclude = ["^\\.claude/", "^docs/"]
